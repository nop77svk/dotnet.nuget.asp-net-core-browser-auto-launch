name: Release upon version tag in main branch

on:
  push:
    tags:
    - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: |
          10.0.x
          8.0.x
          6.0.x
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        lfs: true
        fetch-depth: 0
    - name: Assert tagged commit is on main
      run: ./.github/ci/Assert-TagOnMain.sh
    - name: Generate Changelog
      run: echo "# Good things have arrived" > ${{ github.workspace }}-CHANGELOG.txt
    - name: Set VERSION variable from tag
      run: |
        [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version tag"; exit 1; }
        echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
    - name: Configure private NuGet source credentials
      run: ./.github/ci/Configure-NuGetSource.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Solution clean
      run: |
        rm -rfv */bin */obj && rm -rfv */bin */obj && rm -rfv nupkg
    - name: NuGet restore
      run: dotnet restore
    - name: Check for vulnerable packages
      run: ./.github/ci/Check-VulnerablePackages.sh
    - name: Build
      run: dotnet build -c Release --no-restore -p:Version=${VERSION}
    - name: Test
      run: dotnet test -c Release --no-build
    - name: Pack NuGet package
      run: dotnet pack -c Release --no-build -p:PackageVersion=${VERSION} -o ./nupkg
    - name: Push to NuGet Gallery
      run: dotnet nuget push ./nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
